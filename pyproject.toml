[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ego-hand-wm"
version = "0.1.0"
description = "Geometry-first egocentric hand world-action model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "torch>=2.3",
  "torchvision>=0.18",
  "transformers>=4.56",
  "Pillow>=10",
  "av>=12",
  "ftfy>=6.3",
  "regex>=2024.0",
  "einops>=0.8",
  "timm>=1.0",
]

[project.optional-dependencies]
train = ["wandb>=0.19", "safetensors>=0.4"]
robot-export = ["h5py>=3.10"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
ego-hand-wm-train = "ego_hand_wm.cli.train:main"
ego-hand-wm-validate-vitra = "ego_hand_wm.cli.validate_vitra:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
